<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miranda - Download do PDF</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="./css/style.css" rel="stylesheet" />
  </head>
  <body>
    <section class="hero thanks-hero">
      <div class="hero-bg"></div>
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <div class="hero-eyebrow">Conteudo exclusivo</div>
        <h1>Seu material<br /><em>está pronto.</em></h1>
        <p class="hero-desc">
          Clique no botão abaixo para baixar o PDF com todos os detalhes.
        </p>

        <div class="thanks-panel">
          <p>
            O download começará imediatamente. Se não iniciar, use o link
            alternativo para abrir o arquivo em uma nova aba.
          </p>

          <div class="thanks-actions">
            <a href="./assets/material-miranda.pdf" class="btn-gold" download>
              Baixar PDF agora
            </a>
            <a
              href="./assets/material-miranda.pdf"
              class="btn-ghost"
              target="_blank"
              rel="noopener noreferrer"
            >
              Abrir PDF no navegador
            </a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
